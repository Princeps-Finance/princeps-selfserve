<ng-template #panel>
  <section class="panel">
    @if (showClose()) {
      <button type="button" class="close" (click)="close()">
        <span>{{ 'common.close' | t }}</span><app-icon name="bold-close" [size]="16" />
      </button>
    }
    <h2 class="sr-only" tabindex="-1">{{ title() }}</h2>
    <div class="card"><ng-container [ngTemplateOutlet]="content()" /></div>
  </section>
</ng-template>
