<ng-template #stack>
  <div
    class="stack"
    role="region"
    [attr.aria-label]="'toast.region' | t"
    [attr.data-position]="position()"
    [class.is-bottom]="bottom()"
    [class.is-expanded]="expanded()"
    [style.--front-height.px]="frontHeight()"
    [style.--total-height.px]="totalHeight()"
    [style.--gaps]="toasts().length - 1"
    (pointerenter)="enter($event)"
    (pointerleave)="leave()"
    (focusin)="focus($event)"
    (focusout)="blur($event)"
  >
    @for (toast of toasts(); track toast.id; let index = $index) {
      <div
        class="toast"
        [attr.data-tone]="toast.tone"
        [class.is-behind]="index > 0"
        [class.is-leaving]="toast.leaving"
        [style.--index]="index"
        [style.--offset.px]="offsets()[index]"
        [style.z-index]="toasts().length - index"
        (keydown.escape)="dismiss(toast, $event)"
      >
        <div class="card" #card>
          <div class="message" (pointerup)="$first && toggleFromBody($event)">
            <span class="icon" aria-hidden="true">
              <app-icon [name]="toast.tone === 'success' ? 'bold-success' : toast.tone === 'error' ? 'bold-error' : 'bold-info'" [size]="24" />
            </span>
            <span class="msg" [attr.role]="toast.tone === 'error' ? 'alert' : 'status'">{{ toast.message }}</span>
          </div>
          @if (toast.action; as action) {
            <button
              type="button"
              class="action"
              [disabled]="modalOpen() || !!toast.leaving || (!$first && !expanded())"
              (click)="run(toast)"
            >{{ action.label }}</button>
          }
          <button
            type="button"
            class="close"
            [disabled]="modalOpen() || !!toast.leaving || (!$first && !expanded())"
            [attr.aria-label]="'common.dismiss' | t"
            (click)="dismiss(toast)"
          >
            <app-icon name="bold-close" [size]="14" />
          </button>
        </div>
      </div>
    }
  </div>
</ng-template>
