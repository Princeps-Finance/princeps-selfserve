<ng-template #stack>
  <div
    class="stack"
    role="region"
    [attr.aria-label]="'toast.region' | t"
    [attr.data-position]="position()"
    [class.is-bottom]="bottom()"
    [class.is-expanded]="expanded()"
    [style.--front-height.px]="frontHeight()"
    [style.--total-height.px]="totalHeight()"
    [style.--gaps]="toasts().length - 1"
    (pointerenter)="enter($event)"
    (pointerleave)="leave()"
    (focusin)="focus($event)"
    (focusout)="blur($event)"
  >
    @for (t of toasts(); track t.id; let index = $index) {
      <div
        class="toast"
        [attr.data-tone]="t.tone"
        [class.is-behind]="index > 0"
        [class.is-leaving]="t.leaving"
        [style.--index]="index"
        [style.--offset.px]="offsets()[index]"
        [style.z-index]="toasts().length - index"
        (keydown.escape)="dismiss(t, $event)"
      >
        <div class="card" #card>
          <div class="message" (pointerup)="$first && toggleFromBody($event)">
            <span class="icon" aria-hidden="true">
              <!-- A filled white disc with the symbol cut out in the toast's own colour. -->
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="11" fill="currentColor" />
                @switch (t.tone) {
                  @case ('success') {
                    <path d="M7.5 12.5L10.8 15.8L16.5 9" stroke="var(--fill)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
                  }
                  @case ('error') {
                    <path d="M12 6.8v6" stroke="var(--fill)" stroke-width="2.2" stroke-linecap="round" />
                    <circle cx="12" cy="16.8" r="1.3" fill="var(--fill)" />
                  }
                  @default {
                    <circle cx="12" cy="7.6" r="1.3" fill="var(--fill)" />
                    <path d="M12 11v6" stroke="var(--fill)" stroke-width="2.2" stroke-linecap="round" />
                  }
                }
              </svg>
            </span>
            <span class="msg" [attr.role]="t.tone === 'error' ? 'alert' : 'status'">{{ t.message }}</span>
          </div>
          @if (t.action; as action) {
            <button
              type="button"
              class="action"
              [disabled]="modalOpen() || !!t.leaving || (!$first && !expanded())"
              (click)="run(t)"
            >{{ action.label }}</button>
          }
          <button
            type="button"
            class="close"
            [disabled]="modalOpen() || !!t.leaving || (!$first && !expanded())"
            [attr.aria-label]="'common.dismiss' | t"
            (click)="dismiss(t)"
          >
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M5 5L15 15M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </div>
    }
  </div>
</ng-template>
