<section class="step">
  <app-wizard-progress [current]="10" [total]="14" [label]="'step.nin.eyebrow' | t" />

  <header class="head">
    <h1 class="title">{{ 'step.nin.title' | t }}</h1>
    <p class="subtitle">{{ 'step.nin.subtitle' | t }}</p>
    <app-why-ask [text]="'reason.nin' | t" />
  </header>

  <form class="form" (submit)="$event.preventDefault(); submit()" novalidate>
    <div class="field" [class.is-invalid]="nin.touched && nin.invalid">
      <label class="label" for="nin">{{ 'step.nin.label' | t }}</label>
      <input
        id="nin"
        class="input"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        maxlength="11"
        [formControl]="nin"
        [attr.aria-invalid]="nin.touched && nin.invalid ? true : null"
        [attr.aria-describedby]="nin.touched && nin.invalid ? 'nin-error' : 'nin-hint'"
        (input)="onInput($event)"
      />
      @if (nin.touched && nin.invalid) {
        <p class="msg msg--error" id="nin-error">{{ 'step.nin.invalid' | t }}</p>
      } @else {
        <p class="msg" id="nin-hint">{{ 'step.nin.hint' | t }}</p>
      }
    </div>

    @if (errorKey(); as key) {
      <p class="server-error" role="alert">
        {{ key | t }}
        @if (serverError() === 'name-mismatch') {
          <br /><a class="link" [attr.href]="support" target="_blank" rel="noopener">{{ 'step.nin.support' | t }}</a>
        }
      </p>
    }

    <button type="button" class="cta" [disabled]="submitting()" (click)="submit()">
      <span>{{ submitting() ? ('step.nin.verifying' | t) : ('step.nin.verify' | t) }}</span>
      @if (!submitting()) {
        <app-animated-icon animation="arrow-right" fallback="outline-arrow-right" [size]="18" />
      }
    </button>
  </form>
</section>
