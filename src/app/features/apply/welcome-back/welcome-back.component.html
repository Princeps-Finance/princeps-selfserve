@if (snapshot(); as s) {
<section class="step">
  <header class="head">
    <h1 class="title">{{ 'welcome.title' | t }}, {{ firstName() }}</h1>
    <p class="subtitle">{{ 'welcome.subtitle' | t }}</p>
  </header>

  <div class="actions">
    <button type="button" class="cta" (click)="borrowAgain()">
      <span>{{ 'welcome.borrow' | t }}</span>
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M4 10H16M16 10L11 5M16 10L11 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <button type="button" class="secondary" (click)="updateDetails()">{{ 'welcome.update' | t }}</button>
  </div>

  <p class="fine">{{ 'welcome.fine' | t }}</p>
</section>
}
