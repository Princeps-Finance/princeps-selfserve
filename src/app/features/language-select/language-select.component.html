<main class="screen">
  <header class="brand-row">
    <app-brand-logo class="brand-logo" />
    <span class="tools"><app-read-aloud /><app-theme-toggle /></span>
  </header>

  @if (install.offer()) {
    <div class="install">
      <app-promo-banner
        title="Get Princeps on your phone"
        description="Track your loan and get reminders."
        ctaLabel="Install"
        (action)="install.install()"
        (dismissed)="install.dismiss()"
      />
    </div>
  }

  <section class="content">
    <h1 class="title">{{ 'lang.select.title' | t }}</h1>
    <p class="subtitle">{{ 'lang.select.subtitle' | t }}</p>

    <ul class="lang-grid" [attr.aria-label]="'lang.select.title' | t">
      @for (l of languages; track l.code; let i = $index) {
        <li [style.--i]="i">
          <button type="button" class="lang-card" [attr.lang]="l.code" [class.is-current]="current() === l.code" (click)="choose(l.code)">
            <span class="lang-endonym">{{ l.endonym }}</span>
            <span class="lang-english">{{ l.hello }}</span>
            @if (current() === l.code) {
              <svg class="lang-check" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M4 10.5L8 14.5L16 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            } @else {
              <svg class="lang-check lang-go" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M8 5L13 10L8 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            }
          </button>
        </li>
      }
    </ul>
  </section>

  
</main>
