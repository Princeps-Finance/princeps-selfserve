<main class="screen">
  <header class="brand-row">
    <app-brand-logo class="brand-logo" />
    <span class="tools"><app-read-aloud /><app-theme-toggle /></span>
  </header>

  @if (install.offer()) {
    <div class="install">
      <app-promo-banner
        [title]="'install.banner.title' | t"
        [description]="'install.banner.desc' | t"
        [ctaLabel]="'install.banner.cta' | t"
        [dismissLabel]="'common.dismiss' | t"
        (action)="install.install()"
        (dismissed)="install.dismiss()"
      />
    </div>
  }

  <section class="content">
    <h1 class="title">{{ 'lang.select.title' | t }}</h1>
    <p class="subtitle">{{ 'lang.select.subtitle' | t }}</p>

    <!-- One language per row: rows stacked full width, so a tap cannot land on the wrong one. A tap chooses and continues. -->
    <ul class="lang-grid" [attr.aria-label]="'lang.select.title' | t">
      @for (l of languages; track l.code; let i = $index) {
        <li [style.--i]="i">
          <button type="button" class="lang-card" [attr.lang]="l.code" (click)="choose(l.code)">
            <span class="lang-text">
              <span class="lang-endonym">{{ l.endonym }}</span>
              <span class="lang-english">{{ l.hello }}</span>
            </span>
            <svg class="lang-go" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M8 5L13 10L8 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </li>
      }
    </ul>
  </section>

  
  <app-trust-footer class="foot" />
</main>
