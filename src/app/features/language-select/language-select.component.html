<main class="screen">
  <header class="brand-row">
    <app-brand-logo class="brand-logo" />
    <span class="tools"><app-read-aloud /><app-theme-toggle /></span>
  </header>

  @if (install.offer()) {
    <div class="install">
      <app-promo-banner
        [title]="'install.banner.title' | t"
        [description]="'install.banner.desc' | t"
        [ctaLabel]="'install.banner.cta' | t"
        [dismissLabel]="'common.dismiss' | t"
        (action)="install.install()"
        (dismissed)="install.dismiss()"
      />
    </div>
  }

  <section class="content">
    <h1 class="title">{{ 'lang.select.title' | t }}</h1>
    <p class="subtitle">{{ 'lang.select.subtitle' | t }}</p>

    <!-- One language per row, chosen first and confirmed with Continue: two taps in a row cannot send someone into the wrong language by accident. -->
    <ul class="lang-grid" appRadioGroup role="radiogroup" [attr.aria-label]="'lang.select.title' | t">
      @for (l of languages; track l.code; let i = $index) {
        <li [style.--i]="i">
          <button
            type="button"
            role="radio"
            class="lang-card"
            [attr.lang]="l.code"
            [attr.aria-checked]="current() === l.code"
            [attr.tabindex]="tabFor(l.code, i)"
            [class.is-current]="current() === l.code"
            (click)="choose(l.code)"
          >
            <span class="lang-text">
              <span class="lang-endonym">{{ l.endonym }}</span>
              <span class="lang-english">{{ l.hello }}</span>
            </span>
            <span class="lang-radio" aria-hidden="true">
              @if (current() === l.code) {
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M4 10.5L8 14.5L16 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
              }
            </span>
          </button>
        </li>
      }
    </ul>

    <button type="button" class="cta lang-continue" [disabled]="!current()" (click)="proceed()">
      <span>{{ 'lang.select.continue' | t }}</span>
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M4 10H16M16 10L11 5M16 10L11 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </section>

  
  <app-trust-footer class="foot" />
</main>
