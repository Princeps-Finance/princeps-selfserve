<app-demo-banner />
<app-pwa-banner />
<router-outlet />
<app-toast-host />
<app-help-launcher />
<app-privacy-dialog />
@if (install.offer()) {
  <div class="promo">
    <app-promo-card
      title="Get repayment reminders"
      badge="New"
      description="Add Princeps to your home screen to track your loan and never miss a payment."
      ctaLabel="Add to home screen"
      imageAlt="Princeps app preview"
      (dismissed)="install.dismiss()"
      (action)="install.install()"
    />
  </div>
}
