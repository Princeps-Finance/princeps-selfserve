version: 1
frontend:
  phases:
    preBuild:
      commands:
        - |
          : "${NODE_AUTH_TOKEN:?Set the GitHub Packages read token in Amplify}"
          printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> "$HOME/.npmrc"
          npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist/princeps-selfserve/browser
    files:
      - '**/*'
