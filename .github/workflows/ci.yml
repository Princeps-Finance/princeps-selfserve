name: CI

on:
  pull_request:
  push:
    branches: [main, self-service-development, self-service-production]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: self-service-browser
          path: |
            dist/princeps-selfserve/browser
            customHttp.yml
            scripts/runtime-config.mjs
          if-no-files-found: error
