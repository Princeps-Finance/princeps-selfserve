name: CI

on:
  pull_request:
  push:
    branches: [main, development, self-service-development, self-service-production]

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@princeps-finance'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - run: npm run test:ci
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: self-service-browser
          path: |
            dist/princeps-selfserve/browser
            customHttp.yml
          if-no-files-found: error
