name: CI

on:
  pull_request:
  push:
    branches: [main, self-service-production]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check Vercel functions
        run: npm run typecheck:api
      - name: Unit tests
        run: npm run test:ci
      - name: Production build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Go-live gate (production branch only)
        if: github.base_ref == 'self-service-production' || github.ref_name == 'self-service-production'
        run: npm run check:live
