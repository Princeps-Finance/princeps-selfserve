name: Promote browser artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful CI run ID containing the browser artifact
        required: true
        type: string
      target:
        description: Deployment environment
        type: choice
        options: [development, staging, production]
        required: true

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: self-service-browser
          path: artifact
      - name: Apply public environment configuration
        env:
          NG_APP_ENVIRONMENT: ${{ inputs.target }}
          NG_APP_API_BASE_URL: ${{ vars.NG_APP_API_BASE_URL }}
          NG_APP_ACCOUNTS_URL: ${{ vars.NG_APP_ACCOUNTS_URL }}
        run: node artifact/scripts/runtime-config.mjs artifact/dist/princeps-selfserve/browser artifact/customHttp.yml
      - name: Deploy development to Cloudflare
        if: inputs.target == 'development'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm ci
          npx wrangler deploy --assets artifact/dist/princeps-selfserve/browser
      - uses: actions/upload-artifact@v4
        with:
          name: self-service-${{ inputs.target }}
          path: |
            artifact/dist/princeps-selfserve/browser
            artifact/customHttp.yml
