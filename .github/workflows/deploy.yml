name: Deploy

# Development deploys to Cloudflare when self-service-development changes. The tests run first.
# Production is on AWS Amplify (see docs/amplify.md) and builds from self-service-production on its own.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token limited to Workers on the Princeps account)
# and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [self-service-development]
    # Build filter: a push that only touches notes, docs or local tooling does not need a new deploy.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'design/**'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:api
      - run: npm run test:ci
      - run: npm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
