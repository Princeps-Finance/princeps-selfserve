name: Build browser release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment environment
        required: true
        type: choice
        options: [development, staging, production]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      NG_APP_API_BASE_URL: ${{ vars.NG_APP_API_BASE_URL }}
      NG_APP_ACCOUNTS_URL: ${{ vars.NG_APP_ACCOUNTS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - name: Build for the selected environment
        run: |
          : "${NG_APP_API_BASE_URL:?Set NG_APP_API_BASE_URL in the GitHub environment}"
          npm run build
      - name: Deploy development to Cloudflare
        if: inputs.target == 'development'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:development
      - uses: actions/upload-artifact@v4
        with:
          name: self-service-${{ inputs.target }}
          path: dist/princeps-selfserve/browser
